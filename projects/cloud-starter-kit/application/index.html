<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Starter Kit</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    main {
      width: min(760px, 90%);
      padding: 48px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 7vw, 4rem);
    }

    p {
      margin: 0 auto 24px;
      max-width: 650px;
      color: #cbd5e1;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #475569;
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Cloud Starter Kit</h1>

    <p>
      Secure AWS infrastructure with HTTPS, automated monitoring,
      encrypted backups and continuous deployment.
    </p>

    <div class="status">
      Deployed automatically with GitHub Actions + AWS Systems Manager
    </div>
  </main>
</body>
</html>
